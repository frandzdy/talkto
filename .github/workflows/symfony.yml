name: Symfony Interest Dev

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    symfony-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ '8.0', '8.1', '8.2' ]
                dependencies: [ highest ]
                symfony: [ '*' ]
                include:
                    # Minimum supported dependencies with the oldest supported PHP version
                    -   php: '8.0'
                        dependencies: lowest
                        symfony: '*'
                    # Minimum supported dependencies with the latest supported PHP version
                    -   php: '8.2'
                        dependencies: lowest
                        symfony: '*'
                    -   php: '8.2'
                        dependencies: highest
                        symfony: '*'
                    # Test each supported Symfony version with lowest supported PHP version
                    -   php: '8.1'
                        dependencies: highest
                        symfony: '6.2.*'
                    -   php: '8.1'
                        dependencies: highest
                        symfony: '6.3.*'
                    -   php: '8.2'
                        dependencies: highest
                        symfony: '6.4.*'
                    -   php: '8.2'
                        dependencies: highest
                        symfony: '7.0.*'
        name: PHP ${{ matrix.php }}
        steps:
            #  To automatically get bug fixes and new Php versions for shivammathur/setup-php,
            # change this to (see https://github.com/shivammathur/setup-php#bookmark-versioning):
            # uses: shivammathur/setup-php@v2 shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
            -   name: Setup PHP with tools on ${{ matrix.php-versions }}
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: php-cs-fixer, phpstan, cs2pr

            - name: Run phpcs
              run: phpcs -q --report=checkstyle app/src | cs2pr

            -   name: Update project dependencies
                uses: ramsey/composer-install@v2
                with:
                    dependency-versions: ${{ matrix.dependencies }}
                    working-directory: "app/"
            -   name: Setup Node
                uses: actions/setup-node@v1
                with:
                    node-version: '20.x'

#            -   name: PHP Syntax Checker (Lint)
#                uses: StephaneBour/actions-php-lint@8.1
#                with:
#                    # Folder to check syntax
#                    working-directory: 'app/src'
#
#            -   name: PHP Security Checker
#                uses: StephaneBour/actions-php-security-checker@1.2
#                with:
#                    composer-lock: './composer.lock'
#                    working-directory: 'app/'
            -   uses: actions/checkout@v3
            -   name: Copy .env.test.local
                run: php -r "file_exists('app/.env.test.local') || copy('app/.env.test', 'app/.env.test.local');"
            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v3
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/app/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ hashFiles('**/app/composer.lock') }}
            -   name: Install Dependencies
                run: "
                    cd app/ &&
                    composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist"