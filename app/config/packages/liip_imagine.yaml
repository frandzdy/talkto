# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    twig:
        mode: lazy
    filter_sets:
        profil:
            quality: 85
            filters:
              scale:
                  dim: [ 453, 453 ]
        product:
            quality: 85
            filters:
                scale:
                    dim: [ 316, 403 ]
        product_miniature:
            quality: 85
            filters:
                scale:
                    dim: [ 102, 130 ]
        profil_collection:
            quality: 75
            filters:
                scale:
                    dim: [ 453, 453 ]
        miniature:
            quality: 75
            filters:
                thumbnail  : { size : [67, 67], mode : outbound }