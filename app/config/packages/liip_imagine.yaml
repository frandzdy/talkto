# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    twig:
        mode: lazy
    filter_sets:
        profil:
            quality: 85
            filters:
              scale:
                  dim: [ 453, 453 ]
        product:
            quality: 85
            filters:
                scale:
                    dim: [ 316, 403 ]
        product_details:
            quality: 85
            filters:
                scale:
                    dim: [ 600, 600 ]
        product_modal:
            quality: 85
            filters:
                scale:
                    dim: [ 403, 403 ]
        product_trends:
            quality: 85
            filters:
                scale:
                    dim: [ 324, 324 ]
        product_miniature:
            quality: 85
            filters:
                scale:
                    dim: [ 102, 102 ]
        profil_collection:
            quality: 75
            filters:
                scale:
                    dim: [ 453, 453 ]
        miniature:
            quality: 75
            filters:
                thumbnail  : { size : [67, 67], mode : outbound }