# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    twig:
        mode: lazy
    filter_sets:
        # profil filters
        profil:
            quality: 85
            filters:
                downscale:
                    dim: [ 315, 315 ]
        profil_miniature:
            quality: 85
            filters:
                thumbnail: { size: [ 67, 67 ], mode: outbound }

        ## home page filters
        home_slider:
            quality: 90
            filters:
                downscale:
                    dim: [ 1920, 933 ]
        home_under_slider:
            quality: 90
            filters:
                downscale:
                    dim: [ 376, 233 ]
        home_mid:
            quality: 90
            filters:
                downscale:
                    dim: [ 950, 457 ]
        home_latest:
            quality: 90
            filters:
                downscale:
                    dim: [ 240, 125 ]

        # product filters
        product_modal:
            quality: 85
            filters:
                downscale:
                    dim: [ 316, 403 ]
        product_modal_miniature:
            quality: 85
            filters:
                downscale:
                    dim: [ 102, 130 ]
        product_trends_or_sale:
            quality: 85
            filters:
                downscale:
                    dim: [ 270, 344 ]
        product_details:
            quality: 85
            filters:
                downscale:
                    dim: [ 470, 600 ]
        product_miniature_details:
            quality: 85
            filters:
                downscale:
                    dim: [ 90, 115 ]
        product_miniature:
            quality: 85
            filters:
                thumbnail: { size: [ 130, 130 ], mode: outbound }